name: CI

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # One run away from UTC, so a test that only passes in UTC fails here.
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps (e.g. #994 python-dotenv): a bare
          # install must import the package and the CLI module.
          python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .
      - name: Format check on files this PR touches
        # Whole-repo `ruff format` adoption is deferred (see [tool.ruff.lint] in
        # pyproject.toml), so a full-repo check would fail on untouched files.
        # Instead: any .py file already formatted on the base branch must still
        # be formatted after this PR, and every newly added .py file must be
        # formatted — the formatted set only grows.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          failed=0
          for f in $(git diff --name-only --diff-filter=AMR "$base"...HEAD -- '*.py'); do
            if ! ruff format --check "$f" >/dev/null 2>&1; then
              if git cat-file -e "$base:$f" 2>/dev/null && \
                 git show "$base:$f" | ruff format --check - >/dev/null 2>&1; then
                echo "::error file=$f::was formatted on $base but no longer is; run 'ruff format $f'"
                failed=1
              elif ! git cat-file -e "$base:$f" 2>/dev/null; then
                echo "::error file=$f::new Python files must be formatted; run 'ruff format $f'"
                failed=1
              fi
            fi
          done
          exit $failed
